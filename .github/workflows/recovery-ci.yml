name: Recovery CI

on:
  pull_request:
  push:
    branches:
      - recovery/tele2-production

jobs:
  auth-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
